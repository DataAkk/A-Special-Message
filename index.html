<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message for Bhn ❤️</title>
    <style>
        body {
            background-color: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        h1 { color: #2c3e50; font-size: 1.6rem; }
        p { color: #7f8c8d; font-size: 1.1rem; line-height: 1.5; }
        .buttons {
            margin-top: 30px;
            position: relative;
            height: 120px;
            width: 100%;
        }
        button {
            padding: 12px 28px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            position: absolute;
        }
        #yesBtn {
            background-color: #2ecc71;
            color: white;
            left: 20%;
        }
        #noBtn {
            background-color: #e74c3c;
            color: white;
            right: 20%;
        }
        img { border-radius: 15px; margin-bottom: 15px; width: 180px; }
        .footer { margin-top: 20px; font-weight: bold; color: #3498db; }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/OPU6wUKARA8fycGRtd/giphy.gif" alt="Apology GIF">
        <h1>I'm Sorry, BHN 🥺</h1>
        <p>I swear on God, I am truly sorry for my mistakes. Will you forgive your brother? 🧸✨</p>
        
        <div class="buttons">
            <button id="yesBtn" onclick="accepted()">Yes ✅</button>
            <button id="noBtn" onmouseover="moveNo()">No ❌</button>
        </div>
        
        <div class="footer">with love Kartik ❤️🧸</div>
    </div>

    <script>
        function moveNo() {
            const noBtn = document.getElementById("noBtn");
            // Calculates random position within the screen
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = "fixed";
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        function accepted() {
            document.getElementById("mainCard").innerHTML = `
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/MDJ9IbxxvDUQM/giphy.gif" alt="Happy GIF">
                <h1 style="color: #27ae60;">Thank You, Di! 💖</h1>
                <p>I promise to be the best brother from now on! 🌸✨</p>
                <div style="font-weight: bold; color: #3498db; margin-top: 20px;">with love Kartik ❤️</div>
            `;
        }
    </script>
</body>

</html>
